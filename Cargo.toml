[package]
name = "x3"
description = "A CPU efficient audio encoder/decoder using the X3 codec."
version = "0.3.2"
authors = ["Simon M. Werner <simonwerner@gmail.com>", "Michael Salino-Hugg <michaelsh12391@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
edition = "2024"
repository = "https://github.com/psiphi75/x3-rust"
keywords = ["audio", "compression"]
categories = ["compression", "embedded", "encoding", "multimedia::audio"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
# debug = true      # Enable debug for `perf` profiling

[build-dependencies]
clippy = { version = "^0.0.302", optional = true }

[dev-dependencies]
criterion = "0.8"

[dependencies]
itoa = "1.0.15"
byteorder = { version = "1.3.4", default-features = false }

# std dependencies
hound = { version = "3.5.1", optional = true }
quick-xml = { version = "0.38", optional = true }
clap = { version = "2.33.1", optional = true }
chrono = { version = "0.4.15", optional = true }

[features]
# default = ["std"]

std = ["dep:hound", "dep:quick-xml", "dep:clap", "dep:chrono"]
alloc = []

[[bin]]
name = "x3"
path = "src/bin/x3.rs"
required-features = ["std"]

[[bin]]
name = "wav_to_str"
path = "src/bin/wav_to_str.rs"
required-features = ["std"]

[[bench]]
name = "x3-bench"
harness = false
